# Render Blueprint — deploy this project with one click (New -> Blueprint, or
# point a Render Web Service at the repo and it reads this file).
# This declares the FastAPI backend service so you don't have to hand-type
# build/start commands (which is where the missing "--port" value crept in).
services:
  - type: web
    name: kiranastore-api
    runtime: python
    plan: free
    rootDir: backend
    # Build the Admin dashboard first (admin/dist), then install Python deps.
    # Running from rootDir=backend, so ../admin points at the admin app.
    buildCommand: cd ../admin && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
